name: 'Qlean Q# Static Analyzer'
description: 'Semantic static analyzer and qubit hygiene linter for Q#'
author: 'Qlean'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  path:
    description: 'Path or directory of .qs files to lint'
    required: false
    default: '.'
  format:
    description: 'Output format: human, json, or sarif'
    required: false
    default: 'human'
  include-ast:
    description: 'Whether to include Microsoft AST pattern lints'
    required: false
    default: 'false'
  output-file:
    description: 'Optional file path to write results to (useful for SARIF)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Ensure Rust
      shell: bash
      run: |
        if ! command -v cargo >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi

    - name: Run Qlean
      shell: bash
      run: |
        CMD="cargo run --manifest-path ${{ github.action_path }}/Cargo.toml --release --quiet -- lint ${{ inputs.path }} --format ${{ inputs.format }}"
        if [ "${{ inputs.include-ast }}" = "true" ]; then
          CMD="$CMD --include-ast"
        fi
        if [ -n "${{ inputs.output-file }}" ]; then
          $CMD > "${{ inputs.output-file }}"
        else
          $CMD
        fi

