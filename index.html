<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qlean: Q# Semantic Linter</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-heading: #58a6ff;
            --accent: #238636;
            --warning: #d29922;
            --error: #f85149;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 980px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        h1 {
            color: var(--text-heading);
            margin: 0 0 8px 0;
        }
        p.subtitle {
            margin: 0;
            color: #8b949e;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        button.primary {
            background-color: var(--accent);
            color: #ffffff;
            border-color: rgba(240, 246, 252, 0.1);
            font-weight: 600;
        }
        button:hover {
            opacity: 0.9;
        }
        .editor-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 260px;
            background-color: var(--surface);
            color: #f0f6fc;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            box-sizing: border-box;
            resize: vertical;
        }
        .results-panel {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
        }
        .results-header {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-heading);
        }
        pre {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .diag-item {
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 4px solid var(--warning);
            background-color: rgba(210, 153, 34, 0.1);
        }
        .diag-item.error {
            border-left-color: var(--error);
            background-color: rgba(248, 81, 73, 0.1);
        }
        .clean-state {
            color: #3fb950;
            padding: 8px 0;
        }
        .status-badge {
            font-size: 12px;
            color: #8b949e;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Qlean <span class="status-badge" id="engine-status">(WASM loading...)</span></h1>
            <p class="subtitle">Semantic static analyzer and qubit hygiene linter for Q#</p>
        </header>

        <div class="controls">
            <button class="primary" onclick="runLinter()">Run Qlean</button>
            <button onclick="loadExample('leak')">Example: Ancilla Leak</button>
            <button onclick="loadExample('uncompute')">Example: Missing Uncompute</button>
            <button onclick="loadExample('entangle')">Example: Mid-Circuit Entanglement</button>
            <button onclick="loadExample('ast')">Example: AST Syntax Lint</button>
            <button onclick="loadExample('clean')">Example: Clean</button>
            <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; margin-left: 8px;">
                <input type="checkbox" id="include-ast-toggle" onchange="runLinter()"> Include Microsoft AST lints
            </label>
        </div>

        <div class="editor-container">
            <textarea id="code-input" spellcheck="false"></textarea>
        </div>

        <div class="results-panel">
            <div class="results-header">Diagnostics</div>
            <div id="diagnostics-output">
                <div class="clean-state">Ready to analyze Q# source code.</div>
            </div>
        </div>
    </div>

    <script type="module">
        let wasmEngine = null;
        let wasmModule = null;

        async function initWasm() {
            const badge = document.getElementById('engine-status');
            try {
                const module = await import('./pkg/qlean.js');
                await module.default();
                wasmModule = module;
                wasmEngine = module.lint_with_options || module.lint;
                if (badge) {
                    badge.innerText = '(WASM engine active)';
                    badge.style.color = '#3fb950';
                }
            } catch (err) {
                if (badge) {
                    badge.innerText = '(Simulation fallback)';
                    badge.style.color = '#d29922';
                }
            }
        }

        const examples = {
            leak: `namespace Example {
    operation LeakTest() : Unit {
        use q = Qubit();
        X(q);
    }
}`,
            uncompute: `namespace Example {
    operation UncomputeTest(target : Qubit) : Unit {
        use anc = Qubit();
        CNOT(target, anc);
        Reset(anc);
    }
}`,
            entangle: `namespace Example {
    operation EntangleTest() : Unit {
        use q1 = Qubit();
        use q2 = Qubit();
        let res = M(q1);
        if res == One {
            X(q2);
        }
        Reset(q1);
        Reset(q2);
    }
}`,
            ast: `namespace Example {
    operation AstTest() : Unit {
        let x = 1 / 0;
    }
}`,
            clean: `namespace Example {
    operation CleanTest() : Unit {
        use q = Qubit();
        H(q);
        Reset(q);
    }
}`
        };

        window.loadExample = function(name) {
            const input = document.getElementById('code-input');
            if (name === 'ast') {
                const toggle = document.getElementById('include-ast-toggle');
                if (toggle) toggle.checked = true;
            }
            if (examples[name]) {
                input.value = examples[name];
                runLinter();
            }
        };

        window.runLinter = function() {
            const source = document.getElementById('code-input').value;
            const includeAst = document.getElementById('include-ast-toggle').checked;

            if (wasmModule) {
                try {
                    let jsonStr;
                    if (wasmModule.lint_with_options) {
                        jsonStr = wasmModule.lint_with_options(source, includeAst);
                    } else {
                        jsonStr = wasmModule.lint(source);
                    }
                    renderDiagnostics(JSON.parse(jsonStr));
                    return;
                } catch (e) {
                }
            }

            simulateClientLint(source, includeAst);
        };

        function simulateClientLint(source, includeAst) {
            const diagnostics = [];
            const lines = source.split('\\n');

            if (includeAst && source.includes('1 / 0')) {
                diagnostics.push({
                    file: "input.qs",
                    line: 3,
                    column: 17,
                    rule: "divisionByZero",
                    severity: "error",
                    message: "attempt to divide by zero",
                    qubitIds: []
                });
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.includes('use ') && source.includes('X(q)') && !source.includes('Reset(q)')) {
                    diagnostics.push({
                        file: "input.qs",
                        line: i + 1,
                        column: line.indexOf('use') + 1,
                        rule: "ancilla-leak",
                        severity: "warning",
                        message: "qubit 'q' allocated but never reset before release",
                        qubitIds: ["q"]
                    });
                }
                if (line.includes('CNOT(target, anc)') && source.indexOf('CNOT(target, anc)') === source.lastIndexOf('CNOT(target, anc)')) {
                    diagnostics.push({
                        file: "input.qs",
                        line: i + 1,
                        column: line.indexOf('CNOT') + 1,
                        rule: "missing-uncompute",
                        severity: "warning",
                        message: "qubit 'anc' has unreversed gate 'CNOT' leaving state entangled before release",
                        qubitIds: ["anc"]
                    });
                }
                if (line.includes('if res == One')) {
                    diagnostics.push({
                        file: "input.qs",
                        line: i + 1,
                        column: line.indexOf('if') + 1,
                        rule: "mid-circuit-entanglement",
                        severity: "warning",
                        message: "measurement of qubit 'q1' conditionally controls operations on qubit 'q2'",
                        qubitIds: ["q1", "q2"]
                    });
                }
            }
            renderDiagnostics(diagnostics);
        }

        function renderDiagnostics(diagnostics) {
            const container = document.getElementById('diagnostics-output');
            if (!diagnostics || diagnostics.length === 0) {
                container.innerHTML = '<div class="clean-state">No diagnostics reported. Quantum state hygiene verified.</div>';
                return;
            }

            let html = '';
            for (const d of diagnostics) {
                const isError = d.severity === 'error';
                html += \`
                    <div class="diag-item \${isError ? 'error' : ''}">
                        <strong>\${d.file}:\${d.line}:\${d.column}</strong> [\${d.severity}]: \${d.message} (rule: <code>\${d.rule}</code>)
                    </div>
                \`;
            }
            container.innerHTML = html;
        }

        window.onload = function() {
            initWasm();
            window.loadExample('leak');
        };
    </script>
</body>
</html>
